<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReUnifyd • Link Channels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%); margin:0; }
    .header { position:sticky; top:0; background:rgba(255,255,255,.8); border-bottom:1px solid #e5e7eb; backdrop-filter:blur(10px); padding:14px 0; }
    .header-inner { max-width:1100px; margin:0 auto; padding:0 20px; display:flex; align-items:center; justify-content:space-between; }
    .logo { display:flex; align-items:center; gap:12px; }
    .logo-icon { width:40px; height:40px; background: linear-gradient(135deg, #ef4444, #dc2626); border-radius:12px; display:grid; place-items:center; color:#fff; font-weight:700; }
    .container { max-width: 1000px; margin: 28px auto; padding: 0 20px; }
    .row { display:flex; gap:20px; align-items:stretch; flex-wrap:wrap; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:20px; box-shadow:0 10px 30px rgba(0,0,0,.06); }
    .wide { flex: 1 1 580px; }
    .narrow { flex: 1 1 320px; }
    h1 { margin: 0 0 8px; font-size: 28px; color:#111827; }
    p { margin: 0 0 16px; color:#6b7280; }
    .field { display:flex; gap:10px; align-items:center; }
    input[type=number] { height:44px; width:120px; border-radius:10px; border:1px solid #e5e7eb; padding:0 10px; }
    .btn { background: linear-gradient(135deg, #ef4444, #dc2626); color:#fff; padding:10px 14px; border:none; border-radius:10px; font-weight:600; cursor:pointer; }
    .pill { display:inline-block; padding:6px 10px; background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; border-radius:999px; font-weight:600; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:12px; margin-top: 12px; }
    .slot { border:1px dashed #fecaca; border-radius:12px; padding:16px; background:linear-gradient(135deg,#fff,#fef2f2); display:flex; flex-direction:column; gap:10px; }
    .list { display:grid; gap:10px; }
    .item { display:flex; align-items:center; gap:10px; padding:10px; border:1px solid #e5e7eb; border-radius:12px; background:#fff; }
    .thumb { width:40px; height:40px; border-radius:8px; background:#f3f4f6; display:grid; place-items:center; font-weight:700; color:#ef4444; }
    .topbar { display:flex; gap:8px; align-items:center; }
  </style>
  <script>
    let count = 0;
    function setCount(){
      const n = parseInt(document.getElementById('count').value || '0', 10);
      count = Math.max(0, Math.min(n, 20));
      fetch('/auth/quota', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ count }) })
        .then(r => r.json())
        .then(() => { loadChannels().then(renderSlots); })
        .catch(() => renderSlots());
    }

    function renderSlots(){
      const el = document.getElementById('slots');
      el.innerHTML = '';
      const remainingAttr = el.getAttribute('data-remaining');
      const remaining = remainingAttr === null ? null : Number(remainingAttr);
      const canAdd = remaining === null || isNaN(remaining) ? count : Math.min(count, remaining);
      for(let i=0;i<canAdd;i++){
        const d = document.createElement('div');
        d.className = 'slot';
        d.innerHTML = `<div class="pill">Channel Slot ${i+1}</div>
          <div>Connect a Google account that owns one of your channels.</div>
          <div><button class="btn" onclick="connectGoogle(${i})">Connect Google</button></div>`;
        el.appendChild(d);
      }
      if(remaining !== null && canAdd < count){
        const info = document.createElement('div');
        info.style.marginTop = '10px';
        info.innerHTML = `<span class="pill">Quota reached</span> You have no remaining channel slots.`;
        el.appendChild(info);
      }
    }

    function connectGoogle(idx){
      // After successful OAuth, backend redirects back to /link.html
      window.location.href = `/auth/google/init?next=/ui/link.html`;
    }

    async function ensureAuth(){
      const r = await fetch('/auth/connected');
      if(!r.ok){ window.location.href = '/ui/login.html'; }
    }

    async function loadChannels(){
      const r = await fetch('/youtube/channels');
      if(!r.ok){ return; }
      const data = await r.json();
      const list = document.getElementById('chan-list');
      list.innerHTML = '';
      (data.channels||[]).forEach(c => {
        const row = document.createElement('div');
        row.className = 'item';
        const t = c.thumbnail_url ? `<img class="thumb" src="${c.thumbnail_url}"/>` : `<div class="thumb">YT</div>`;
        row.innerHTML = `${t}<div><div style="font-weight:600; color:#111827;">${c.title}</div><div style="color:#6b7280; font-size:12px;">${c.yt_channel_id}</div></div>`;
        list.appendChild(row);
      });
      // set remaining for slot rendering and reflect quota in input
      const el = document.getElementById('slots');
      if(typeof data.remaining === 'number') { el.setAttribute('data-remaining', String(data.remaining)); }
      else { el.removeAttribute('data-remaining'); }
      if(typeof data.quota === 'number'){ document.getElementById('count').value = data.quota; count = data.quota; }
    }

    async function logout(){
      await fetch('/auth/logout', { method:'POST' });
      window.location.href = '/ui/login.html';
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await ensureAuth();
      await loadChannels();
      renderSlots();
      const url = new URL(window.location.href);
      if(url.searchParams.get('linked')){
        // a simple feedback; could be replaced by a toast
        alert('Channel linked successfully.');
        url.searchParams.delete('linked');
        history.replaceState({}, '', url.pathname);
        await loadChannels();
      }
    });
  </script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo"><div class="logo-icon">R</div><div style="font-weight:700;">ReUnifyd</div></div>
      <div class="topbar">
        <a href="/" class="pill" style="text-decoration:none;">Home</a>
        <a href="/ui/dashboard.html" class="btn" style="text-decoration:none;">Dashboard</a>
        <button class="btn" onclick="logout()">Log Out</button>
      </div>
    </div>
  </header>
  <div class="container">
    <div class="row">
      <div class="card wide">
        <h1>Link your YouTube channels</h1>
        <p>Connect each Google account that owns a channel you want in your dashboard.</p>
        <div class="field">
          <label for="count" style="font-weight:600;">How many channels do you have?</label>
          <input id="count" type="number" min="0" max="20" value="0" />
          <button class="btn" onclick="setCount()">Set</button>
        </div>
        <div id="slots" class="grid"></div>
      </div>
      <div class="card narrow">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
          <h2 style="margin:0; font-size:18px;">Linked Channels</h2>
          <button class="btn" onclick="loadChannels()" style="padding:8px 12px;">Refresh</button>
        </div>
        <div id="chan-list" class="list" style="margin-top:10px;"></div>
      </div>
    </div>
  </div>
</body>
</html>
