<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ReUnifyd - Link Channels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>

  <style>
    :root{
      /* home-style tokens */
      --bg:#ffffff; --bg-soft:#f8fafc; --card:#ffffff; --line:#e5e7eb;
      --text:#111827; --muted:#6b7280; --brand:#ef4444; --brand-d:#dc2626;
      --radius:16px; --shadow:0 10px 30px rgba(0,0,0,.06);
      /* golden-ish */
      --fs-0:16px; --fs-1:26px; --fs-2:42px;
      --sp-0:8px; --sp-1:13px; --sp-2:21px; --sp-3:34px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--text);background:linear-gradient(135deg,#fff 0%,#f8fafc 100%)}
    .wrap{max-width:1100px;margin:var(--sp-3) auto;padding:0 20px;display:grid;grid-template-columns:360px 1fr;gap:20px}
    @media(max-width:960px){.wrap{grid-template-columns:1fr}}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:var(--sp-2)}
    h1{margin:0 0 var(--sp-1);font-size:var(--fs-2);line-height:1.1;font-weight:800;letter-spacing:-.01em}
    p{margin:0 0 var(--sp-1);color:var(--muted);font-size:var(--fs-0)}
    .btn{
      appearance:none;border:none;cursor:pointer;border-radius:12px;padding:12px 16px;font-weight:700;color:#fff;
      background:linear-gradient(135deg,var(--brand),var(--brand-d));box-shadow:0 8px 18px rgba(239,68,68,.25);
      transition:transform .06s,filter .2s,box-shadow .2s
    }
    .btn:hover{filter:brightness(1.05);box-shadow:0 10px 22px rgba(239,68,68,.32)}
    .btn:active{transform:translateY(1px) scale(.99)}
    .btn.secondary{background:#fff;color:var(--brand);border:1px solid var(--brand);box-shadow:none;}
    .btn.secondary:hover{filter:none;background:rgba(239,68,68,0.08);}
    .btn:disabled{opacity:0.6;cursor:not-allowed;box-shadow:none;filter:none;}
    .button-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:var(--sp-1);}

    .est{margin-top:var(--sp-2);background:var(--bg-soft);border:1px solid var(--line);border-radius:14px;padding:var(--sp-1)}
    .est-row{display:flex;align-items:center;justify-content:space-between}
    .price{font-size:28px;font-weight:800;color:var(--brand)}
    .note{font-size:12px;color:var(--muted);margin-top:6px}

    /* channel cards grid (RIGHT) */
    .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
    .slot{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;display:flex;flex-direction:column;gap:10px}
    .thumbbox{height:120px;border:1px solid var(--line);border-radius:10px;background:#f3f4f6}
    .ch-row{display:flex;gap:12px;align-items:center}
    .thumb{width:44px;height:44px;border-radius:10px;background:#f3f4f6;display:grid;place-items:center;font-weight:800;color:var(--brand)}
    .title{font-weight:800}
    .meta{font-size:.85rem;color:var(--muted)}
  </style>
</head>
<body>
  <main class="wrap">
    <!-- LEFT: add channel + estimate -->
    <section class="card">
      <h1>Add a channel</h1>
      <p>Connect the Google account that owns a channel you want in your dashboard.</p>

      <div class="button-row">
        <button type="button" class="btn" id="connectBtn">Connect Google</button>
        <button type="button" class="btn secondary" id="nextBtn">Next</button>
      </div>

      <div class="est">
        <div class="est-row"><div class="note">Plan</div><div id="current-plan" style="font-weight:800">-</div></div>
        <div class="est-row" style="margin-top:10px;"><div style="font-weight:700">Estimated monthly</div><div class="price" id="est-price">$0</div></div>
        <div class="note" id="est-note">Estimate updates as you add channels.</div>
      </div>

      <p class="note" style="margin-top:var(--sp-2)">Each "channel" can be from YouTube, Instagram, or TikTok.</p>
    </section>

    <!-- RIGHT: only the channel cards -->
    <section class="card">
      <div id="chan-grid" class="grid" aria-live="polite"></div>
    </section>
  </main>

  <script>
    // ---------- State ----------
    let plan = 'basic';            // 'basic' | 'creator' | 'pro'
    let channels = [];             // loaded from backend

    // ---------- Helpers ----------
    const $ = id => document.getElementById(id);
    const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
    const connectBtn = $('connectBtn');
    const nextBtn = $('nextBtn');

    function computePrice(p, n){
      if (p === 'basic')   return (n <= 3) ? 0 : 'upgrade';
      if (p === 'creator') return 7 + 2 * n;
      if (p === 'pro')     return 10 + 2 * n;
      return 0;
    }

    function setPlan(p){
      if (!['basic','creator','pro'].includes(p)) return;
      plan = p;
      sessionStorage.setItem('reunifyd_plan', plan);
      $('current-plan').textContent = cap(plan);
      updateEstimate();
    }

    function planFromUrlOrSession(){
      const u = new URL(window.location.href);
      const q = (u.searchParams.get('plan') || '').toLowerCase();
      if (['basic','creator','pro'].includes(q)) return q;
      const remembered = (sessionStorage.getItem('reunifyd_plan') || '').toLowerCase();
      if (['basic','creator','pro'].includes(remembered)) return remembered;
      return 'basic';
    }

    function updateEstimate(){
      const n = channels.length;
      const res = computePrice(plan, n);
      if (res === 'upgrade'){
        $('est-price').textContent = 'Upgrade required';
        $('est-note').textContent  = 'Basic is free for up to 3 total channels.';
      } else {
        $('est-price').textContent = plan === 'basic' ? '$0' : `$${res.toFixed(2)}/mo`;
        $('est-note').textContent  = (plan === 'creator')
          ? 'Creator pricing: $7 base + $2 per channel.'
          : (plan === 'pro')
            ? 'Pro pricing: $10 base + $2 per channel.'
            : 'Basic plan selected.';
      }
    }

    function updateNextButtonState(){
      if (!nextBtn) return;
      const isLoading = nextBtn.dataset.loading === '1';
      nextBtn.disabled = isLoading || channels.length === 0;
    }

    async function handleNext(){
      if (!nextBtn || nextBtn.dataset.loading === '1' || channels.length === 0) return;
      const originalText = nextBtn.textContent;
      nextBtn.dataset.loading = '1';
      nextBtn.textContent = 'Syncing...';
      updateNextButtonState();
      try {
        const resp = await fetch('/youtube/sync/manual', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: '{}',
        });
        let data = {};
        try {
          data = await resp.json();
        } catch (_) {
          data = {};
        }
        if (!resp.ok || (data && data.ok === false)) {
          const detail = data && (data.detail || data.error);
          throw new Error(detail || 'Sync failed (' + resp.status + ')');
        }
        window.location.href = '/ui/dashboard.html';
      } catch (err) {
        console.error('channel sync failed', err);
        alert('Unable to sync channels right now. Please try again.');
        nextBtn.dataset.loading = '0';
        nextBtn.textContent = originalText;
        updateNextButtonState();
      }
    }

    function renderChannelCards(){
      const host = $('chan-grid');
      host.innerHTML = '';

      if (!channels.length){
        const empty = document.createElement('div');
        empty.className = 'slot';
        empty.innerHTML = `
          <div class="thumbbox"></div>
          <div class="title">No channels linked yet</div>
          <div class="meta">Use "Connect Google" to add your first channel.</div>`;
        host.appendChild(empty);
        return;
      }

      channels.forEach((c, idx)=>{
        const card = document.createElement('div');
        card.className = 'slot';

        const bannerSrc = c.banner_url || null;
        const thumbSrc = c.thumbnail_url || c.avatar_url || null;
        const fallbackLetters = (c.title || 'YT').slice(0, 2).toUpperCase();

        const thumbBig = bannerSrc
          ? `<img src="${bannerSrc}" class="thumbbox" style="object-fit:cover;border-radius:10px">`
          : thumbSrc
            ? `<img src="${thumbSrc}" class="thumbbox" style="object-fit:cover;border-radius:10px">`
            : `<div class="thumbbox"></div>`;

        const thumbSmall = thumbSrc
          ? `<img src="${thumbSrc}" class="thumb" alt="">`
          : `<div class="thumb">${fallbackLetters}</div>`;

        const subscriberValue = typeof c.subscriber_count === 'number'
          ? c.subscriber_count
          : Number.parseInt(c.subscriber_count ?? '', 10);
        const subs = Number.isFinite(subscriberValue) ? subscriberValue.toLocaleString() : 'N/A';
        const metaBits = [];
        if (c.custom_url) metaBits.push(c.custom_url);
        else if (c.external_channel_id) metaBits.push(c.external_channel_id);
        if (c.last_synced_at){
          try {
            const dt = new Date(c.last_synced_at);
            if (!Number.isNaN(dt.getTime())){
              metaBits.push(`Synced ${dt.toLocaleDateString()}`);
            }
          } catch (_) {}
        }

        const metaLine = metaBits.join(' | ');

        card.innerHTML = `
          ${thumbBig}
          <div class="ch-row">
            ${thumbSmall}
            <div>
              <div class="title">${c.title || 'Channel ' + (idx + 1)}</div>
              <div class="meta">Subs: ${subs}</div>
              ${metaLine ? `<div class=\"meta\">${metaLine}</div>` : ''}
            </div>
          </div>`;
        host.appendChild(card);
      });
    }

    function connectGoogle(){
      sessionStorage.setItem('reunifyd_plan', plan);
      const u = new URL('/auth/google/init', window.location.origin);
      u.searchParams.set('next', '/ui/link.html');
      u.searchParams.set('plan', plan);
      window.location.href = u.toString();
    }

    async function ensureAuth(){
      const r = await fetch('/auth/connected');
      if(!r.ok){
        window.location.href = '/ui/login.html';
      }
    }

    async function loadChannels(){
      try{
        const r = await fetch('/youtube/channels', { cache: 'no-cache' });
        if(!r.ok) return [];
        const data = await r.json();
        const raw = Array.isArray(data.channels) ? data.channels : [];
        const uniq = [];
        const seen = new Set();
        for (const entry of raw){
          if (!entry || typeof entry !== 'object') continue;
          const key = entry.id ?? `${entry.external_channel_id || 'channel'}-${entry.platform_account_id ?? ''}`;
          if (seen.has(key)) continue;
          seen.add(key);
          let subscriberCount = null;
          if (entry.subscriber_count !== undefined && entry.subscriber_count !== null){
            const parsed = Number.parseInt(entry.subscriber_count, 10);
            if (!Number.isNaN(parsed)) subscriberCount = parsed;
          }
          uniq.push({
            ...entry,
            thumbnail_url: entry.thumbnail_url || entry.avatar_url || null,
            subscriber_count: subscriberCount,
          });
        }
        uniq.sort((a, b)=> (a.title || '').localeCompare(b.title || '', undefined, { sensitivity: 'base' }));
        return uniq;
      }catch(err){
        console.error('loadChannels failed', err);
        return [];
      }
    }

    async function bootstrap(){
      await ensureAuth();
      updateNextButtonState();

      setPlan(planFromUrlOrSession());

      channels = await loadChannels();
      renderChannelCards();
      updateEstimate();
      updateNextButtonState();

      const url = new URL(window.location.href);
      if (url.searchParams.get('linked')){
        const qPlan = (url.searchParams.get('plan') || '').toLowerCase();
        if (['basic','creator','pro'].includes(qPlan)){
          setPlan(qPlan);
        }
        channels = await loadChannels();
        renderChannelCards();
        updateEstimate();
        updateNextButtonState();
        url.searchParams.delete('linked');
        const search = url.searchParams.toString();
        history.replaceState({}, '', search ? `${url.pathname}?${search}` : url.pathname);
      }

      if (connectBtn) {
        connectBtn.addEventListener('click', (e)=>{
          e.preventDefault();
          connectGoogle();
        });
      }

      if (nextBtn) {
        nextBtn.addEventListener('click', (e)=>{
          e.preventDefault();
          handleNext();
        });
      }

      window.addEventListener('message', (evt)=>{
        if (evt?.data?.type === 'reunifyd:setPlan' && evt.data.plan){
          setPlan(String(evt.data.plan).toLowerCase());
          updateEstimate();
        }
      });
    }

    window.addEventListener('DOMContentLoaded', bootstrap);
  </script>
</body>
</html>
