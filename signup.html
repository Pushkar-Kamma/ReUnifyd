<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReUnifyd • Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%); margin:0; }
    .container { max-width: 520px; margin: 80px auto; padding: 0 20px; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:28px; box-shadow:0 10px 30px rgba(0,0,0,.06); }
    h1 { margin: 0 0 8px; font-size: 28px; color:#111827; }
    p { margin: 0 0 16px; color:#6b7280; }
    .field { display:flex; flex-direction:column; gap:8px; margin:12px 0; }
    label { font-weight:600; color:#374151; }
    input { height:48px; border-radius:12px; border:1px solid #e5e7eb; padding:0 14px; font-size:16px; }
    .actions { display:flex; gap:12px; align-items:center; margin-top:12px; }
    .btn { background: linear-gradient(135deg, #ef4444, #dc2626); color:#fff; padding:12px 18px; border:none; border-radius:12px; font-weight:600; cursor:pointer; }
    .link { text-decoration:none; color:#ef4444; font-weight:600; }
    .header { position:sticky; top:0; background:rgba(255,255,255,.8); border-bottom:1px solid #e5e7eb; backdrop-filter:blur(10px); padding:14px 0; }
    .header-inner { max-width:1100px; margin:0 auto; padding:0 20px; display:flex; align-items:center; justify-content:space-between; }
    .logo { display:flex; align-items:center; gap:12px; }
    .logo-icon { width:40px; height:40px; background: linear-gradient(135deg, #ef4444, #dc2626); border-radius:12px; display:grid; place-items:center; color:#fff; font-weight:700; }
  </style>
  <script>
    async function signup(ev){
      ev.preventDefault();
      const email = document.getElementById('email').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const r = await fetch('/auth/signup', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email, username, password })
      });
      if(r.ok){
        // Go straight to Google linking after creating the account
        window.location.href = '/auth/google/init?next=/ui/link.html';
        return;
      }
      const data = await r.json().catch(()=>({detail:'Signup failed'}));
      alert(data.detail || 'Signup failed');
    }
  </script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo"><div class="logo-icon">R</div><div style="font-weight:700;">ReUnifyd</div></div>
      <a href="/ui/login.html" class="link">Log In</a>
    </div>
  </header>
  <div class="container">
    <div class="card">
      <h1>Create your account</h1>
      <p>Use one account to link all your YouTube channels.</p>
      <form onsubmit="signup(event)">
        <div class="field"><label>Email</label><input id="email" type="email" required /></div>
        <div class="field"><label>Username</label><input id="username" required /></div>
        <div class="field"><label>Password</label><input id="password" type="password" required minlength="6" /></div>
        <div class="actions">
          <button class="btn" type="submit">Sign Up</button>
          <a class="link" href="/ui/login.html">Already have an account?</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
