# Render Blueprint — defines the backend service.
# When you connect the repo on Render, it offers to provision from this file.
# Secrets (sync: false) must be set manually in the Render dashboard.

services:
  - type: web
    name: reunifyd-api
    runtime: docker
    region: ohio                    # match Supabase region (us-east-2)
    plan: free                      # upgrade to starter ($7/mo) for always-on
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_BASE_URL
        value: https://reunifyd-api.onrender.com
      - key: FRONTEND_URL
        value: https://reunifyd.vercel.app
      - key: GOOGLE_REDIRECT_URI
        value: https://reunifyd-api.onrender.com/auth/google/callback
      - key: CORS_ALLOW_ORIGINS
        value: https://reunifyd.vercel.app
      - key: SESSION_SAME_SITE
        value: none
      - key: EMAIL_FROM
        value: noreply@edstart.xyz
      # --- Secrets: set in Render dashboard ---
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
